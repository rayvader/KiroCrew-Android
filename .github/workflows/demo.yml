name: Demo video

# Films the latest release on an Android 14 emulator against a live Kiro Crew
# demo gateway. The runner joins the tailnet with an ephemeral key, so the
# gateway is never on the public internet. Run by hand only:
#   gh workflow run demo.yml -f host=<name>.ts.net:8443
# Needs two repo secrets: TS_AUTHKEY (ephemeral, tagged Tailscale key) and
# DEMO_SIGNIN_URL (a `kirocrew token` link for the demo gateway).
on:
  workflow_dispatch:
    inputs:
      host:
        description: "Demo gateway on the tailnet, host:port"
        required: true
        default: "ip-172-31-21-6.tail79f307.ts.net:8443"

permissions:
  contents: read

concurrency:
  group: demo-video
  cancel-in-progress: true

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEMO_HOST: ${{ inputs.host }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the latest release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "$GITHUB_REPOSITORY" --pattern 'KiroCrew-*.apk' --dir .

      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Reach the demo gateway
        run: |
          [[ $DEMO_HOST =~ ^[A-Za-z0-9.-]+\.ts\.net(:[0-9]+)?$ ]] || { echo "host must be a .ts.net name"; exit 1; }
          curl -sf --retry 6 --retry-delay 5 --retry-all-errors "https://$DEMO_HOST/api/health"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Film the tour
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DEMO_SIGNIN_URL: ${{ secrets.DEMO_SIGNIN_URL }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          # MagicDNS, so the emulator can look up the .ts.net name.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -dns-server 100.100.100.100
          disable-animations: false
          script: bash .github/demo/run.sh

      - name: Join the clips
        if: always()
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null)
          cd demo-out
          ls tour*.mp4 >/dev/null 2>&1 || exit 0
          for f in tour*.mp4; do echo "file '$f'"; done > list.txt
          ffmpeg -loglevel error -f concat -safe 0 -i list.txt -c copy -movflags +faststart raw_full.mp4

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-video
          path: demo-out/
          if-no-files-found: ignore
          retention-days: 14
