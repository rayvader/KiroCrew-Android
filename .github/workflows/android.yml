name: Android APK

# Runs the unit tests, builds the release APK and publishes it as a GitHub
# release on every push. Pull requests only build and keep the APK as an artifact.
on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
  workflow_dispatch:
    inputs:
      keep_all_video:
        description: "Keep the e2e video of every feature, not only failed ones (for a full demo.mp4)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags, for the release changelog

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Unit tests and release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: kirocrew
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        id: apk
        run: |
          VERSION="1.0.${{ github.run_number }}"
          FILE="KiroCrew-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Show signing certificate
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$APKSIGNER" verify --print-certs "${{ steps.apk.outputs.file }}" | grep -i "SHA-256"

      - uses: actions/upload-artifact@v4
        with:
          name: kirocrew-apk
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      # Only builds from main are full releases. Branch builds are pre-releases,
      # so the in-app update check (which reads "latest") never offers them.
      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ github.ref_name != 'main' && '--prerelease' || '' }}
        run: |
          TAG="v${{ steps.apk.outputs.version }}"
          # The changelog is a nicety: a failure there must not stop the release.
          python3 .github/scripts/release_notes.py "$TAG" --sha "${{ github.sha }}" $PRERELEASE > notes.md \
            || echo "## What's new

          Changelog unavailable for this build." > notes.md
          printf '\n---\nBuilt from `%s` (`%s`). Download the APK on your phone and open it to install.\n' \
            "${{ github.ref_name }}" "${{ github.sha }}" >> notes.md
          gh release create "$TAG" "${{ steps.apk.outputs.file }}" \
            --target "${{ github.sha }}" \
            --title "Kiro Crew Android ${{ steps.apk.outputs.version }}" \
            --notes-file notes.md \
            $PRERELEASE

  smoke:
    # Installs the APK on an Android 14 emulator, adds a server through the UI,
    # loads a test page and keeps screenshots as the smoke-screenshot artifact.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: kirocrew-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Serve the test page (emulator reaches it as 10.0.2.2)
        run: nohup python3 -m http.server 8000 --bind 127.0.0.1 --directory .github/smoke-site > "$RUNNER_TEMP/http.log" 2>&1 &

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/smoke.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshot
          path: smoke/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    # Every README feature, driven through the real UI on an Android 14 emulator
    # against a fake gateway (.github/e2e/gateway.py). Each feature is screen-recorded;
    # the e2e-videos artifact keeps the clips of failed and video-only features (all of
    # them with the keep_all_video run input), a stitched demo.mp4 and the report.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: kirocrew-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start two fake gateways (the emulator reaches them as 10.0.2.2)
        run: |
          nohup python3 .github/e2e/gateway.py --port 8000 --name Primary > "$RUNNER_TEMP/gw1.log" 2>&1 &
          nohup python3 .github/e2e/gateway.py --port 8001 --name Second > "$RUNNER_TEMP/gw2.log" 2>&1 &
          sleep 1
          curl -sf http://127.0.0.1:8000/chat > /dev/null
          curl -sf http://127.0.0.1:8001/chat > /dev/null

      - name: Run the feature tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          E2E_KEEP_ALL_VIDEO: ${{ inputs.keep_all_video && '1' || '0' }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/e2e/run.sh

      - name: Report and demo video
        if: always()
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null)
          python3 .github/e2e/report.py e2e-out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-videos
          path: e2e-out/
          if-no-files-found: ignore
          retention-days: 14
